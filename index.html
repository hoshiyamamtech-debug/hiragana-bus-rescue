<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ひらがなバスレスキューDX</title>
  <meta name="theme-color" content="#fff7d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ひらがなバスDX">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg1: #fff1b8;
      --bg2: #ccf5ff;
      --bg3: #e8ddff;
      --main: #ff8700;
      --blue: #2f80ed;
      --green: #19a761;
      --red: #e05252;
      --purple: #7d4cff;
      --text: #26324a;
      --card: rgba(255, 255, 255, 0.94);
      --shadow: rgba(38, 50, 74, 0.18);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(255,255,255,0.9), transparent 25%),
        radial-gradient(circle at 85% 20%, rgba(255,255,255,0.65), transparent 20%),
        linear-gradient(160deg, var(--bg1), var(--bg2) 55%, var(--bg3));
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      touch-action: manipulation;
    }

    .app {
      width: min(100vw, 540px);
      min-height: 100vh;
      padding: 14px;
      padding-bottom: calc(14px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .cloud {
      position: fixed;
      font-size: 44px;
      opacity: 0.5;
      pointer-events: none;
      animation: cloudMove 12s linear infinite;
      z-index: 0;
    }

    .cloud.one { top: 90px; left: -70px; animation-duration: 15s; }
    .cloud.two { top: 210px; left: -100px; animation-duration: 19s; animation-delay: -6s; }
    .cloud.three { top: 520px; left: -90px; animation-duration: 17s; animation-delay: -11s; }

    @keyframes cloudMove {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 160px)); }
    }

    .top-bar, .screen {
      position: relative;
      z-index: 1;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .title {
      font-size: 22px;
      font-weight: 1000;
      line-height: 1.12;
      color: #25436b;
      text-shadow: 0 2px 0 rgba(255,255,255,0.9);
      letter-spacing: 0.02em;
    }

    .pill-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .small-btn {
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #ffffff;
      color: #25436b;
      font-weight: 900;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
      font-size: 15px;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 12px;
    }

    .screen.active {
      display: flex;
    }

    .card {
      background: var(--card);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 10px 28px var(--shadow);
      border: 3px solid rgba(255,255,255,0.88);
    }

    .hero {
      text-align: center;
      padding: 22px 16px;
      position: relative;
      overflow: hidden;
    }

    .bus {
      font-size: 72px;
      line-height: 1;
      margin: 4px 0 12px;
      animation: bounce 1.1s ease-in-out infinite;
      filter: drop-shadow(0 8px 0 rgba(0,0,0,0.08));
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }

    .lead {
      font-size: 22px;
      font-weight: 1000;
      line-height: 1.42;
      margin: 8px 0;
    }

    .note {
      font-size: 15px;
      line-height: 1.6;
      margin: 8px 0 0;
      color: #596172;
      font-weight: 800;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .mode-btn {
      width: 100%;
      min-height: 86px;
      border-radius: 25px;
      padding: 16px;
      color: white;
      font-size: 22px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.16);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      overflow: hidden;
    }

    .mode-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent, rgba(255,255,255,0.22), transparent);
      transform: translateX(-100%);
      animation: shine 3s ease-in-out infinite;
    }

    @keyframes shine {
      0%, 45% { transform: translateX(-100%); }
      70%, 100% { transform: translateX(100%); }
    }

    .mode-btn span {
      font-size: 43px;
      flex: 0 0 auto;
      z-index: 1;
    }

    .mode-btn div {
      z-index: 1;
    }

    .mode-easy { background: linear-gradient(135deg, #ffbc42, #ff7900); }
    .mode-normal { background: linear-gradient(135deg, #57acff, #246bff); }
    .mode-hard { background: linear-gradient(135deg, #43d17a, #0f9d58); }
    .mode-challenge { background: linear-gradient(135deg, #b05cff, #6437ff); }

    .status-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .status-box {
      background: white;
      border-radius: 18px;
      padding: 9px 8px;
      text-align: center;
      font-weight: 1000;
      box-shadow: 0 4px 0 rgba(0,0,0,0.09);
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .road-wrap {
      background: rgba(255,255,255,0.75);
      border-radius: 999px;
      padding: 5px;
      height: 30px;
      position: relative;
      box-shadow: inset 0 3px 0 rgba(0,0,0,0.07);
      overflow: hidden;
    }

    .road-line {
      position: absolute;
      inset: 13px 8px auto 8px;
      border-top: 3px dashed rgba(37,67,107,0.25);
    }

    .progress {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffcf33, #ff8a00);
      transition: width 0.35s ease;
      position: relative;
      z-index: 1;
    }

    .mini-bus {
      position: absolute;
      top: -4px;
      left: 0%;
      transform: translateX(-10px);
      z-index: 2;
      font-size: 28px;
      transition: left 0.35s ease;
    }

    .question-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 230px;
      position: relative;
      overflow: hidden;
    }

    .question-label {
      font-size: 21px;
      font-weight: 1000;
      color: #25436b;
      margin-bottom: 10px;
    }

    .target-kana {
      width: min(62vw, 286px);
      height: min(62vw, 286px);
      min-width: 210px;
      min-height: 210px;
      border-radius: 50px;
      background: radial-gradient(circle at 30% 20%, #ffffff, #fff4c7);
      border: 8px solid #ffd35a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(115px, 34vw, 174px);
      font-weight: 1000;
      line-height: 1;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.08), 0 8px 0 rgba(0,0,0,0.1);
      color: #223656;
      transition: transform 0.18s ease;
    }

    .target-kana.pulse {
      animation: kanaPulse 0.45s ease;
    }

    @keyframes kanaPulse {
      0% { transform: scale(1); }
      45% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    .hint {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 1000;
      color: #5a4b2a;
      min-height: 32px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .choice-btn {
      min-height: 94px;
      border-radius: 25px;
      background: #ffffff;
      color: #25436b;
      font-size: clamp(42px, 16vw, 74px);
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.16);
      border: 4px solid rgba(47,128,237,0.22);
      position: relative;
      overflow: hidden;
    }

    .choice-btn:active, .mode-btn:active, .small-btn:active, .big-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(0,0,0,0.14);
    }

    .choice-btn.good {
      background: #d7ffe7;
      border-color: var(--green);
      color: var(--green);
      animation: correctPop 0.45s ease;
    }

    .choice-btn.bad {
      background: #ffe1e1;
      border-color: var(--red);
      color: var(--red);
      animation: shake 0.26s ease;
    }

    @keyframes correctPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .message {
      min-height: 62px;
      border-radius: 19px;
      background: white;
      padding: 12px;
      font-size: 20px;
      font-weight: 1000;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.09);
    }

    .message.good-text { color: var(--green); }
    .message.bad-text { color: var(--red); }
    .message.bonus-text { color: var(--purple); }

    .big-btn {
      width: 100%;
      min-height: 64px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--main), #ff5e00);
      color: white;
      font-size: 22px;
      font-weight: 1000;
      box-shadow: 0 8px 0 rgba(0,0,0,0.16);
      padding: 12px 16px;
    }

    .secondary {
      background: linear-gradient(135deg, #6aaeff, #2f80ed);
    }

    .parent-panel, .collection-panel {
      display: none;
      background: white;
      border-radius: 21px;
      padding: 14px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.09);
      font-size: 14px;
      line-height: 1.55;
    }

    .parent-panel.active, .collection-panel.active {
      display: block;
    }

    .parent-panel label {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 900;
      margin: 8px 0;
    }

    .parent-panel input {
      width: 22px;
      height: 22px;
    }

    .badge-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }

    .badge {
      min-height: 52px;
      border-radius: 16px;
      background: #f0f2f7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      filter: grayscale(1);
      opacity: 0.45;
    }

    .badge.on {
      background: #fff4c7;
      filter: none;
      opacity: 1;
      box-shadow: inset 0 -4px 0 rgba(0,0,0,0.08);
    }

    .result-face {
      font-size: 78px;
      text-align: center;
      margin: 8px 0;
      animation: bounce 1.1s ease-in-out infinite;
    }

    .result-title {
      font-size: 28px;
      font-weight: 1000;
      text-align: center;
      color: #25436b;
      margin: 4px 0 10px;
    }

    .result-score {
      font-size: 24px;
      font-weight: 1000;
      text-align: center;
      margin: 8px 0;
    }

    .stars {
      font-size: 32px;
      text-align: center;
      letter-spacing: 3px;
      min-height: 42px;
    }

    .confetti {
      position: fixed;
      width: 11px;
      height: 16px;
      border-radius: 3px;
      top: -20px;
      z-index: 9;
      pointer-events: none;
      animation: fall 1.2s ease-in forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.8;
      }
    }

    @media (max-width: 360px) {
      .app { padding: 10px; }
      .title { font-size: 19px; }
      .lead { font-size: 20px; }
      .choice-btn { min-height: 84px; }
      .target-kana { min-width: 190px; min-height: 190px; }
      .mode-btn { min-height: 78px; font-size: 20px; }
    }
  </style>
</head>
<body>
  <div class="cloud one">☁️</div>
  <div class="cloud two">☁️</div>
  <div class="cloud three">☁️</div>

  <main class="app">
    <div class="top-bar">
      <div class="title">🚌 ひらがな<br>バスレスキューDX</div>
      <div class="pill-row">
        <button id="collectionBtn" class="small-btn" type="button">🏅</button>
        <button id="parentBtn" class="small-btn" type="button">おとな</button>
      </div>
    </div>

    <section id="menuScreen" class="screen active">
      <div class="card hero">
        <div class="bus">🚌💨</div>
        <p class="lead">ひらがなをよんで、<br>こまったバスをたすけよう！</p>
        <p class="note">メロディ・れんぞくボーナス・ごほうびバッジつき。</p>
      </div>

      <div id="collectionPanel" class="collection-panel">
        <strong>あつめた ごほうび</strong>
        <div id="badgeGrid" class="badge-grid"></div>
        <p class="note">高い点をとると、バッジが増えます。</p>
      </div>

      <div id="parentPanel" class="parent-panel">
        <strong>おとな向け設定</strong>
        <label>
          <input id="soundToggle" type="checkbox" checked>
          音声・効果音を使う
        </label>
        <label>
          <input id="musicToggle" type="checkbox" checked>
          メロディを使う
        </label>
        <label>
          <input id="hintToggle" type="checkbox" checked>
          ヒントを出す
        </label>
        <label>
          <input id="autoNextToggle" type="checkbox" checked>
          正解後に自動で次へ進む
        </label>
        <p>音は、最初に画面をタップしたあと鳴ります。iPhoneのマナーモード中は小さくなる場合があります。</p>
      </div>

      <div class="menu-grid">
        <button class="mode-btn mode-easy" type="button" data-mode="easy">
          <div>はじめて<br>あ〜お</div>
          <span>⭐</span>
        </button>
        <button class="mode-btn mode-normal" type="button" data-mode="normal">
          <div>かんたん<br>あ〜そ</div>
          <span>🌈</span>
        </button>
        <button class="mode-btn mode-hard" type="button" data-mode="hard">
          <div>いっぱい<br>あ〜ん</div>
          <span>🚀</span>
        </button>
        <button class="mode-btn mode-challenge" type="button" data-mode="challenge">
          <div>チャレンジ<br>まちがい少なめ</div>
          <span>🏆</span>
        </button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="status-row">
        <div id="questionCount" class="status-box">1 / 10</div>
        <div id="scoreBox" class="status-box">⭐ 0</div>
        <div id="streakBox" class="status-box">🔥 0</div>
      </div>

      <div class="road-wrap">
        <div class="road-line"></div>
        <div id="progressBar" class="progress"></div>
        <div id="miniBus" class="mini-bus">🚌</div>
      </div>

      <div class="card question-card">
        <div id="questionLabel" class="question-label">おなじ もじを タッチ！</div>
        <div id="targetKana" class="target-kana">あ</div>
        <div id="hintText" class="hint">あひるの「あ」</div>
      </div>

      <div id="choices" class="choices"></div>

      <div id="message" class="message">よく見てえらんでね</div>

      <button id="nextBtn" class="big-btn secondary" type="button" style="display:none;">つぎへ</button>
      <button id="backMenuBtn" class="small-btn" type="button">メニューにもどる</button>
    </section>

    <section id="resultScreen" class="screen">
      <div class="card">
        <div id="resultFace" class="result-face">🎉</div>
        <div id="resultTitle" class="result-title">よくできました！</div>
        <div id="resultScore" class="result-score">10もん中 0もん せいかい</div>
        <div id="resultStars" class="stars">⭐⭐⭐</div>
        <p id="resultMessage" class="lead" style="text-align:center;">バスをたすけたよ！</p>
      </div>
      <button id="retryBtn" class="big-btn" type="button">もういっかい</button>
      <button id="homeBtn" class="big-btn secondary" type="button">メニューへ</button>
    </section>
  </main>

  <script>
    "use strict";

    const kanaData = [
      { kana: "あ", hint: "あひるの「あ」", sound: "あ" },
      { kana: "い", hint: "いぬの「い」", sound: "い" },
      { kana: "う", hint: "うさぎの「う」", sound: "う" },
      { kana: "え", hint: "えんぴつの「え」", sound: "え" },
      { kana: "お", hint: "おにぎりの「お」", sound: "お" },
      { kana: "か", hint: "かさの「か」", sound: "か" },
      { kana: "き", hint: "きりんの「き」", sound: "き" },
      { kana: "く", hint: "くるまの「く」", sound: "く" },
      { kana: "け", hint: "けむしの「け」", sound: "け" },
      { kana: "こ", hint: "こまの「こ」", sound: "こ" },
      { kana: "さ", hint: "さかなの「さ」", sound: "さ" },
      { kana: "し", hint: "しまうまの「し」", sound: "し" },
      { kana: "す", hint: "すいかの「す」", sound: "す" },
      { kana: "せ", hint: "せみの「せ」", sound: "せ" },
      { kana: "そ", hint: "そらの「そ」", sound: "そ" },
      { kana: "た", hint: "たこの「た」", sound: "た" },
      { kana: "ち", hint: "ちょうちょの「ち」", sound: "ち" },
      { kana: "つ", hint: "つみきの「つ」", sound: "つ" },
      { kana: "て", hint: "てぶくろの「て」", sound: "て" },
      { kana: "と", hint: "とけいの「と」", sound: "と" },
      { kana: "な", hint: "なすの「な」", sound: "な" },
      { kana: "に", hint: "にじの「に」", sound: "に" },
      { kana: "ぬ", hint: "ぬいぐるみの「ぬ」", sound: "ぬ" },
      { kana: "ね", hint: "ねこの「ね」", sound: "ね" },
      { kana: "の", hint: "のりものの「の」", sound: "の" },
      { kana: "は", hint: "はなの「は」", sound: "は" },
      { kana: "ひ", hint: "ひこうきの「ひ」", sound: "ひ" },
      { kana: "ふ", hint: "ふねの「ふ」", sound: "ふ" },
      { kana: "へ", hint: "へびの「へ」", sound: "へ" },
      { kana: "ほ", hint: "ほしの「ほ」", sound: "ほ" },
      { kana: "ま", hint: "まめの「ま」", sound: "ま" },
      { kana: "み", hint: "みかんの「み」", sound: "み" },
      { kana: "む", hint: "むしの「む」", sound: "む" },
      { kana: "め", hint: "めがねの「め」", sound: "め" },
      { kana: "も", hint: "ももの「も」", sound: "も" },
      { kana: "や", hint: "やまの「や」", sound: "や" },
      { kana: "ゆ", hint: "ゆきの「ゆ」", sound: "ゆ" },
      { kana: "よ", hint: "よっとの「よ」", sound: "よ" },
      { kana: "ら", hint: "らっぱの「ら」", sound: "ら" },
      { kana: "り", hint: "りんごの「り」", sound: "り" },
      { kana: "る", hint: "るすばんの「る」", sound: "る" },
      { kana: "れ", hint: "れもんの「れ」", sound: "れ" },
      { kana: "ろ", hint: "ろけっとの「ろ」", sound: "ろ" },
      { kana: "わ", hint: "わにの「わ」", sound: "わ" },
      { kana: "を", hint: "えほんをよむの「を」", sound: "を" },
      { kana: "ん", hint: "みかんの「ん」", sound: "ん" }
    ];

    const modeMap = {
      easy: { count: 5, questions: 10, choices: 3, challenge: false },
      normal: { count: 15, questions: 10, choices: 3, challenge: false },
      hard: { count: kanaData.length, questions: 10, choices: 3, challenge: false },
      challenge: { count: kanaData.length, questions: 12, choices: 4, challenge: true }
    };

    const badges = ["⭐", "🌈", "🚀", "🏆", "🚌", "🎵", "💎", "🦁", "🐬", "👑"];
    const positiveMessages = [
      "せいかい！バスを たすけたよ！",
      "やったね！ぴかぴか しゅっぱつ！",
      "すごい！よく見つけたね！",
      "ナイス！レスキュー成功！"
    ];

    let currentMode = "easy";
    let activeKanaPool = [];
    let questionIndex = 0;
    let totalQuestions = 10;
    let score = 0;
    let streak = 0;
    let maxStreak = 0;
    let currentAnswer = null;
    let locked = false;
    let lastQuestions = [];
    let audioContext = null;
    let musicTimer = null;
    let musicStep = 0;

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");
    const resultScreen = document.getElementById("resultScreen");
    const parentBtn = document.getElementById("parentBtn");
    const collectionBtn = document.getElementById("collectionBtn");
    const parentPanel = document.getElementById("parentPanel");
    const collectionPanel = document.getElementById("collectionPanel");
    const badgeGrid = document.getElementById("badgeGrid");
    const soundToggle = document.getElementById("soundToggle");
    const musicToggle = document.getElementById("musicToggle");
    const hintToggle = document.getElementById("hintToggle");
    const autoNextToggle = document.getElementById("autoNextToggle");
    const questionCount = document.getElementById("questionCount");
    const scoreBox = document.getElementById("scoreBox");
    const streakBox = document.getElementById("streakBox");
    const progressBar = document.getElementById("progressBar");
    const miniBus = document.getElementById("miniBus");
    const questionLabel = document.getElementById("questionLabel");
    const targetKana = document.getElementById("targetKana");
    const hintText = document.getElementById("hintText");
    const choices = document.getElementById("choices");
    const message = document.getElementById("message");
    const nextBtn = document.getElementById("nextBtn");
    const backMenuBtn = document.getElementById("backMenuBtn");
    const retryBtn = document.getElementById("retryBtn");
    const homeBtn = document.getElementById("homeBtn");
    const resultFace = document.getElementById("resultFace");
    const resultTitle = document.getElementById("resultTitle");
    const resultScore = document.getElementById("resultScore");
    const resultStars = document.getElementById("resultStars");
    const resultMessage = document.getElementById("resultMessage");

    function showScreen(screenName) {
      menuScreen.classList.remove("active");
      gameScreen.classList.remove("active");
      resultScreen.classList.remove("active");

      if (screenName === "menu") {
        menuScreen.classList.add("active");
      }

      if (screenName === "game") {
        gameScreen.classList.add("active");
      }

      if (screenName === "result") {
        resultScreen.classList.add("active");
      }
    }

    function ensureAudio() {
      if (!audioContext) {
        const AudioCtor = window.AudioContext || window.webkitAudioContext;
        if (AudioCtor) {
          audioContext = new AudioCtor();
        }
      }

      if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
      }
    }

    function playTone(frequency, duration, type, volume) {
      if (!soundToggle.checked) {
        return;
      }

      ensureAudio();

      if (!audioContext) {
        return;
      }

      const now = audioContext.currentTime;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.type = type;
      oscillator.frequency.setValueAtTime(frequency, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(volume, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.03);
    }

    function playCorrectSound() {
      playTone(523.25, 0.12, "sine", 0.08);
      window.setTimeout(function() { playTone(659.25, 0.13, "sine", 0.08); }, 95);
      window.setTimeout(function() { playTone(783.99, 0.18, "sine", 0.08); }, 190);
    }

    function playWrongSound() {
      playTone(220, 0.11, "triangle", 0.07);
      window.setTimeout(function() { playTone(174.61, 0.14, "triangle", 0.06); }, 105);
    }

    function playBonusSound() {
      playTone(659.25, 0.09, "sine", 0.07);
      window.setTimeout(function() { playTone(783.99, 0.09, "sine", 0.07); }, 85);
      window.setTimeout(function() { playTone(987.77, 0.16, "sine", 0.08); }, 170);
    }

    function startMusic() {
      stopMusic();

      if (!musicToggle.checked || !soundToggle.checked) {
        return;
      }

      ensureAudio();

      if (!audioContext) {
        return;
      }

      const melody = [261.63, 329.63, 392.00, 329.63, 293.66, 349.23, 392.00, 523.25];

      musicTimer = window.setInterval(function() {
        if (!musicToggle.checked || !soundToggle.checked) {
          stopMusic();
          return;
        }

        const freq = melody[musicStep % melody.length];
        playTone(freq, 0.12, "sine", 0.025);
        musicStep += 1;
      }, 430);
    }

    function stopMusic() {
      if (musicTimer) {
        window.clearInterval(musicTimer);
        musicTimer = null;
      }
    }

    function speak(text) {
      if (!soundToggle.checked) {
        return;
      }

      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = 0.82;
      utterance.pitch = 1.08;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function getBestScore() {
      const key = "hiraganaBusBestDX_" + currentMode;
      const saved = window.localStorage.getItem(key);
      const value = Number(saved);

      if (Number.isFinite(value)) {
        return value;
      }

      return 0;
    }

    function saveBestScore() {
      const best = getBestScore();

      if (score > best) {
        const key = "hiraganaBusBestDX_" + currentMode;
        window.localStorage.setItem(key, String(score));
      }
    }

    function getBadgeCount() {
      const saved = window.localStorage.getItem("hiraganaBusBadgesDX");
      const value = Number(saved);

      if (Number.isFinite(value)) {
        return Math.max(0, Math.min(badges.length, value));
      }

      return 0;
    }

    function saveBadgeCount(count) {
      const safeCount = Math.max(0, Math.min(badges.length, count));
      window.localStorage.setItem("hiraganaBusBadgesDX", String(safeCount));
    }

    function renderBadges() {
      const count = getBadgeCount();
      badgeGrid.innerHTML = "";

      badges.forEach(function(badge, index) {
        const div = document.createElement("div");
        div.className = "badge";

        if (index < count) {
          div.classList.add("on");
        }

        div.textContent = badge;
        badgeGrid.appendChild(div);
      });
    }

    function unlockBadgeIfNeeded() {
      const currentCount = getBadgeCount();
      let targetCount = currentCount;

      if (score >= Math.ceil(totalQuestions * 0.4)) {
        targetCount = Math.max(targetCount, 1);
      }

      if (score >= Math.ceil(totalQuestions * 0.7)) {
        targetCount = Math.max(targetCount, 2);
      }

      if (score === totalQuestions) {
        targetCount = Math.max(targetCount, 4);
      }

      if (maxStreak >= 5) {
        targetCount = Math.max(targetCount, 5);
      }

      if (currentMode === "challenge" && score >= 10) {
        targetCount = Math.max(targetCount, 7);
      }

      if (currentMode === "challenge" && score === totalQuestions) {
        targetCount = badges.length;
      }

      if (targetCount > currentCount) {
        saveBadgeCount(targetCount);
        return true;
      }

      return false;
    }

    function shuffleArray(array) {
      const result = array.slice();

      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = result[i];
        result[i] = result[j];
        result[j] = temp;
      }

      return result;
    }

    function makeQuestionPool(mode) {
      const count = modeMap[mode].count;
      return kanaData.slice(0, count);
    }

    function pickQuestionKana() {
      let candidates = activeKanaPool.slice();

      if (activeKanaPool.length > 3) {
        candidates = candidates.filter(function(item) {
          return !lastQuestions.includes(item.kana);
        });
      }

      if (candidates.length === 0) {
        candidates = activeKanaPool.slice();
      }

      const picked = candidates[Math.floor(Math.random() * candidates.length)];
      lastQuestions.push(picked.kana);

      if (lastQuestions.length > 3) {
        lastQuestions.shift();
      }

      return picked;
    }

    function makeChoices(answerItem) {
      const choiceCount = modeMap[currentMode].choices;
      const wrongPool = activeKanaPool.filter(function(item) {
        return item.kana !== answerItem.kana;
      });

      const wrongs = shuffleArray(wrongPool).slice(0, choiceCount - 1);
      return shuffleArray([answerItem].concat(wrongs));
    }

    function updateStatus() {
      questionCount.textContent = String(questionIndex + 1) + " / " + String(totalQuestions);
      scoreBox.textContent = "⭐ " + String(score);
      streakBox.textContent = "🔥 " + String(streak);
      const progressPercent = Math.round((questionIndex / totalQuestions) * 100);
      progressBar.style.width = String(progressPercent) + "%";
      miniBus.style.left = String(progressPercent) + "%";
    }

    function setMessage(text, type) {
      message.textContent = text;
      message.classList.remove("good-text");
      message.classList.remove("bad-text");
      message.classList.remove("bonus-text");

      if (type === "good") {
        message.classList.add("good-text");
      }

      if (type === "bad") {
        message.classList.add("bad-text");
      }

      if (type === "bonus") {
        message.classList.add("bonus-text");
      }
    }

    function renderQuestion() {
      locked = false;
      nextBtn.style.display = "none";
      updateStatus();

      currentAnswer = pickQuestionKana();
      targetKana.textContent = currentAnswer.kana;
      targetKana.classList.remove("pulse");
      void targetKana.offsetWidth;
      targetKana.classList.add("pulse");

      if (modeMap[currentMode].challenge) {
        questionLabel.textContent = "よく見て！おなじ もじは？";
      } else {
        questionLabel.textContent = "おなじ もじを タッチ！";
      }

      if (hintToggle.checked) {
        hintText.textContent = currentAnswer.hint;
      } else {
        hintText.textContent = "";
      }

      setMessage("おなじ もじは どれかな？", "");
      choices.innerHTML = "";

      const choiceItems = makeChoices(currentAnswer);
      choices.style.gridTemplateColumns = "repeat(" + String(choiceItems.length) + ", 1fr)";

      choiceItems.forEach(function(item) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-btn";
        button.textContent = item.kana;
        button.setAttribute("aria-label", item.kana);
        button.addEventListener("click", function() {
          checkAnswer(item.kana, button);
        });
        choices.appendChild(button);
      });

      speak(currentAnswer.sound);
    }

    function createConfetti(count) {
      const palette = ["#ff8a00", "#ffd23f", "#2f80ed", "#19a761", "#ff5ca8", "#7d4cff"];

      for (let i = 0; i < count; i += 1) {
        const piece = document.createElement("div");
        piece.className = "confetti";
        piece.style.left = String(Math.random() * 100) + "vw";
        piece.style.background = palette[Math.floor(Math.random() * palette.length)];
        piece.style.animationDelay = String(Math.random() * 0.35) + "s";
        piece.style.transform = "rotate(" + String(Math.random() * 180) + "deg)";
        document.body.appendChild(piece);

        window.setTimeout(function() {
          piece.remove();
        }, 1700);
      }
    }

    function checkAnswer(kana, button) {
      if (locked) {
        return;
      }

      ensureAudio();

      if (kana === currentAnswer.kana) {
        locked = true;
        score += 1;
        streak += 1;
        maxStreak = Math.max(maxStreak, streak);
        button.classList.add("good");
        playCorrectSound();

        let text = positiveMessages[Math.floor(Math.random() * positiveMessages.length)];
        let type = "good";

        if (streak >= 3 && streak % 3 === 0) {
          text = "れんぞく " + String(streak) + "かい！ボーナス！";
          type = "bonus";
          playBonusSound();
          createConfetti(12);
        }

        setMessage(text, type);
        speak("せいかい。すごいね。");

        Array.from(choices.children).forEach(function(child) {
          child.disabled = true;

          if (child.textContent === currentAnswer.kana) {
            child.classList.add("good");
          }
        });

        updateStatus();

        if (autoNextToggle.checked) {
          window.setTimeout(function() {
            goNext();
          }, 920);
        } else {
          nextBtn.style.display = "block";
        }

        return;
      }

      button.classList.add("bad");
      button.disabled = true;
      streak = 0;
      updateStatus();
      playWrongSound();
      setMessage("おしい！もういっかい見てみよう", "bad");
      speak("おしい。もういっかい。");
    }

    function goNext() {
      questionIndex += 1;

      if (questionIndex >= totalQuestions) {
        finishGame();
        return;
      }

      renderQuestion();
    }

    function finishGame() {
      progressBar.style.width = "100%";
      miniBus.style.left = "100%";
      saveBestScore();
      const unlocked = unlockBadgeIfNeeded();
      renderBadges();
      stopMusic();

      resultScore.textContent = String(totalQuestions) + "もん中 " + String(score) + "もん せいかい";

      if (score === totalQuestions) {
        resultFace.textContent = "🏆";
        resultTitle.textContent = "ぜんぶ せいかい！";
        resultStars.textContent = "⭐⭐⭐⭐⭐";
        resultMessage.textContent = unlocked ? "新しいバッジをゲット！バスはぴかぴか！" : "バスは ぴかぴか！すごい！";
        createConfetti(42);
        speak("ぜんぶせいかい。すごいね。");
      } else if (score >= Math.ceil(totalQuestions * 0.7)) {
        resultFace.textContent = "🎉";
        resultTitle.textContent = "とても よくできました！";
        resultStars.textContent = "⭐⭐⭐⭐";
        resultMessage.textContent = unlocked ? "新しいバッジをゲットしたよ！" : "たくさんのバスを たすけたよ！";
        createConfetti(24);
        speak("とてもよくできました。");
      } else if (score >= Math.ceil(totalQuestions * 0.4)) {
        resultFace.textContent = "😊";
        resultTitle.textContent = "がんばったね！";
        resultStars.textContent = "⭐⭐⭐";
        resultMessage.textContent = unlocked ? "バッジをひとつゲット！" : "もういっかいで もっとできるよ！";
        speak("がんばったね。");
      } else {
        resultFace.textContent = "🚌";
        resultTitle.textContent = "れんしゅう できたね！";
        resultStars.textContent = "⭐⭐";
        resultMessage.textContent = "ゆっくりで だいじょうぶ！";
        speak("れんしゅうできたね。");
      }

      showScreen("result");
    }

    function startGame(mode) {
      ensureAudio();
      currentMode = mode;
      activeKanaPool = makeQuestionPool(mode);
      totalQuestions = modeMap[mode].questions;
      questionIndex = 0;
      score = 0;
      streak = 0;
      maxStreak = 0;
      currentAnswer = null;
      locked = false;
      lastQuestions = [];
      showScreen("game");
      startMusic();
      renderQuestion();
    }

    parentBtn.addEventListener("click", function() {
      parentPanel.classList.toggle("active");
      collectionPanel.classList.remove("active");
    });

    collectionBtn.addEventListener("click", function() {
      renderBadges();
      collectionPanel.classList.toggle("active");
      parentPanel.classList.remove("active");
    });

    Array.from(document.querySelectorAll(".mode-btn")).forEach(function(button) {
      button.addEventListener("click", function() {
        const mode = button.getAttribute("data-mode");
        startGame(mode);
      });
    });

    nextBtn.addEventListener("click", function() {
      goNext();
    });

    backMenuBtn.addEventListener("click", function() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }

      stopMusic();
      showScreen("menu");
    });

    retryBtn.addEventListener("click", function() {
      startGame(currentMode);
    });

    homeBtn.addEventListener("click", function() {
      stopMusic();
      showScreen("menu");
    });

    musicToggle.addEventListener("change", function() {
      if (gameScreen.classList.contains("active")) {
        if (musicToggle.checked) {
          startMusic();
        } else {
          stopMusic();
        }
      }
    });

    soundToggle.addEventListener("change", function() {
      if (!soundToggle.checked) {
        stopMusic();

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      } else if (gameScreen.classList.contains("active")) {
        startMusic();
      }
    });

    document.addEventListener("visibilitychange", function() {
      if (document.hidden) {
        stopMusic();

        if ("speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      } else if (gameScreen.classList.contains("active")) {
        startMusic();
      }
    });

    renderBadges();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {
          // オフライン対応に失敗しても、ゲーム本体はそのまま動きます。
        });
      });
    }
  </script>
</body>
</html>
