<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ひらがなバスレスキュー</title>
  <meta name="theme-color" content="#fff7d6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ひらがなバス">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg1: #fff7d6;
      --bg2: #d8f4ff;
      --main: #ff8a00;
      --sub: #2f80ed;
      --good: #20a464;
      --bad: #e05252;
      --text: #2b2b2b;
      --card: rgba(255, 255, 255, 0.92);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background: linear-gradient(160deg, var(--bg1), var(--bg2));
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: stretch;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      touch-action: manipulation;
    }

    .app {
      width: min(100vw, 520px);
      min-height: 100vh;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .title {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.2;
      color: #25436b;
      text-shadow: 0 2px 0 rgba(255,255,255,0.8);
    }

    .small-btn {
      min-height: 44px;
      padding: 8px 12px;
      border-radius: 999px;
      background: #ffffff;
      color: #25436b;
      font-weight: 800;
      box-shadow: 0 4px 0 rgba(0,0,0,0.12);
      font-size: 15px;
    }

    .screen {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 12px;
    }

    .screen.active {
      display: flex;
    }

    .card {
      background: var(--card);
      border-radius: 26px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(37,67,107,0.15);
      border: 3px solid rgba(255,255,255,0.8);
    }

    .hero {
      text-align: center;
      padding: 22px 16px;
    }

    .bus {
      font-size: 68px;
      line-height: 1;
      margin: 6px 0 12px;
      animation: bounce 1.3s ease-in-out infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    .lead {
      font-size: 22px;
      font-weight: 900;
      line-height: 1.45;
      margin: 8px 0;
    }

    .note {
      font-size: 15px;
      line-height: 1.6;
      margin: 8px 0 0;
      color: #555;
      font-weight: 700;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .mode-btn {
      width: 100%;
      min-height: 86px;
      border-radius: 24px;
      padding: 16px;
      color: white;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 7px 0 rgba(0,0,0,0.16);
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .mode-btn span {
      font-size: 42px;
      flex: 0 0 auto;
    }

    .mode-easy { background: linear-gradient(135deg, #ffad33, #ff7a00); }
    .mode-normal { background: linear-gradient(135deg, #4ea3ff, #246bff); }
    .mode-hard { background: linear-gradient(135deg, #43d17a, #159456); }

    .status-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      align-items: center;
    }

    .status-box {
      background: white;
      border-radius: 18px;
      padding: 9px 8px;
      text-align: center;
      font-weight: 900;
      box-shadow: 0 4px 0 rgba(0,0,0,0.09);
      min-height: 46px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
    }

    .question-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      min-height: 230px;
      position: relative;
      overflow: hidden;
    }

    .question-label {
      font-size: 22px;
      font-weight: 900;
      color: #25436b;
      margin-bottom: 10px;
    }

    .target-kana {
      width: min(62vw, 280px);
      height: min(62vw, 280px);
      min-width: 210px;
      min-height: 210px;
      border-radius: 46px;
      background: #fff;
      border: 8px solid #ffd35a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(115px, 34vw, 170px);
      font-weight: 900;
      line-height: 1;
      box-shadow: inset 0 -8px 0 rgba(0,0,0,0.08), 0 8px 0 rgba(0,0,0,0.1);
    }

    .hint {
      margin-top: 14px;
      font-size: 20px;
      font-weight: 900;
      color: #5a4b2a;
      min-height: 32px;
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .choice-btn {
      min-height: 92px;
      border-radius: 24px;
      background: #ffffff;
      color: #25436b;
      font-size: clamp(42px, 16vw, 74px);
      font-weight: 900;
      box-shadow: 0 7px 0 rgba(0,0,0,0.16);
      border: 4px solid rgba(47,128,237,0.22);
    }

    .choice-btn:active, .mode-btn:active, .small-btn:active, .big-btn:active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 rgba(0,0,0,0.14);
    }

    .choice-btn.good {
      background: #d7ffe7;
      border-color: var(--good);
      color: var(--good);
    }

    .choice-btn.bad {
      background: #ffe1e1;
      border-color: var(--bad);
      color: var(--bad);
    }

    .message {
      min-height: 58px;
      border-radius: 18px;
      background: white;
      padding: 12px;
      font-size: 21px;
      font-weight: 900;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 0 rgba(0,0,0,0.09);
    }

    .message.good-text { color: var(--good); }
    .message.bad-text { color: var(--bad); }

    .progress-wrap {
      background: rgba(255,255,255,0.7);
      border-radius: 999px;
      padding: 5px;
      height: 24px;
    }

    .progress {
      height: 100%;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #ffcf33, #ff8a00);
      transition: width 0.25s ease;
    }

    .big-btn {
      width: 100%;
      min-height: 64px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--main), #ff5e00);
      color: white;
      font-size: 22px;
      font-weight: 900;
      box-shadow: 0 7px 0 rgba(0,0,0,0.16);
      padding: 12px 16px;
    }

    .secondary {
      background: linear-gradient(135deg, #6aaeff, #2f80ed);
    }

    .result-face {
      font-size: 76px;
      text-align: center;
      margin: 8px 0;
    }

    .result-title {
      font-size: 28px;
      font-weight: 900;
      text-align: center;
      color: #25436b;
      margin: 4px 0 10px;
    }

    .result-score {
      font-size: 24px;
      font-weight: 900;
      text-align: center;
      margin: 8px 0;
    }

    .stars {
      font-size: 32px;
      text-align: center;
      letter-spacing: 3px;
      min-height: 42px;
    }

    .parent-panel {
      display: none;
      background: white;
      border-radius: 20px;
      padding: 14px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.09);
      font-size: 14px;
      line-height: 1.55;
    }

    .parent-panel.active {
      display: block;
    }

    .parent-panel label {
      display: flex;
      gap: 8px;
      align-items: center;
      font-weight: 800;
      margin: 8px 0;
    }

    .parent-panel input {
      width: 22px;
      height: 22px;
    }

    .footer-space {
      height: max(8px, env(safe-area-inset-bottom));
    }

    @media (max-width: 360px) {
      .app {
        padding: 10px;
      }

      .title {
        font-size: 19px;
      }

      .lead {
        font-size: 20px;
      }

      .choice-btn {
        min-height: 82px;
      }

      .target-kana {
        min-width: 190px;
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="top-bar">
      <div class="title">🚌 ひらがな<br>バスレスキュー</div>
      <button id="parentBtn" class="small-btn" type="button">おとな</button>
    </div>

    <section id="menuScreen" class="screen active">
      <div class="card hero">
        <div class="bus">🚌💨</div>
        <p class="lead">ひらがなをよんで、<br>こまったバスをたすけよう！</p>
        <p class="note">1回10問。まちがえても大丈夫。<br>正解すると星がふえます。</p>
      </div>

      <div id="parentPanel" class="parent-panel">
        <strong>おとな向け設定</strong>
        <label>
          <input id="soundToggle" type="checkbox" checked>
          音声を使う
        </label>
        <label>
          <input id="hintToggle" type="checkbox" checked>
          ヒントを出す
        </label>
        <label>
          <input id="autoNextToggle" type="checkbox" checked>
          正解後に自動で次へ進む
        </label>
        <p>スマホのホーム画面に追加すると、アプリのように開けます。</p>
      </div>

      <div class="menu-grid">
        <button class="mode-btn mode-easy" type="button" data-mode="easy">
          <div>はじめて<br>あ〜お</div>
          <span>⭐</span>
        </button>
        <button class="mode-btn mode-normal" type="button" data-mode="normal">
          <div>かんたん<br>あ〜そ</div>
          <span>🌈</span>
        </button>
        <button class="mode-btn mode-hard" type="button" data-mode="hard">
          <div>いっぱい<br>あ〜ん</div>
          <span>🚀</span>
        </button>
      </div>
    </section>

    <section id="gameScreen" class="screen">
      <div class="status-row">
        <div id="questionCount" class="status-box">1 / 10</div>
        <div id="scoreBox" class="status-box">⭐ 0</div>
        <div id="bestBox" class="status-box">🏆 0</div>
      </div>

      <div class="progress-wrap">
        <div id="progressBar" class="progress"></div>
      </div>

      <div class="card question-card">
        <div class="question-label">おなじ もじを タッチ！</div>
        <div id="targetKana" class="target-kana">あ</div>
        <div id="hintText" class="hint">あひるの「あ」</div>
      </div>

      <div id="choices" class="choices"></div>

      <div id="message" class="message">よく見てえらんでね</div>

      <button id="nextBtn" class="big-btn secondary" type="button" style="display:none;">つぎへ</button>
      <button id="backMenuBtn" class="small-btn" type="button">メニューにもどる</button>
    </section>

    <section id="resultScreen" class="screen">
      <div class="card">
        <div id="resultFace" class="result-face">🎉</div>
        <div id="resultTitle" class="result-title">よくできました！</div>
        <div id="resultScore" class="result-score">10もん中 0もん せいかい</div>
        <div id="resultStars" class="stars">⭐⭐⭐</div>
        <p id="resultMessage" class="lead" style="text-align:center;">バスをたすけたよ！</p>
      </div>
      <button id="retryBtn" class="big-btn" type="button">もういっかい</button>
      <button id="homeBtn" class="big-btn secondary" type="button">メニューへ</button>
    </section>

    <div class="footer-space"></div>
  </main>

  <script>
    "use strict";

    const kanaData = [
      { kana: "あ", hint: "あひるの「あ」", sound: "あ" },
      { kana: "い", hint: "いぬの「い」", sound: "い" },
      { kana: "う", hint: "うさぎの「う」", sound: "う" },
      { kana: "え", hint: "えんぴつの「え」", sound: "え" },
      { kana: "お", hint: "おにぎりの「お」", sound: "お" },
      { kana: "か", hint: "かさの「か」", sound: "か" },
      { kana: "き", hint: "きりんの「き」", sound: "き" },
      { kana: "く", hint: "くるまの「く」", sound: "く" },
      { kana: "け", hint: "けむしの「け」", sound: "け" },
      { kana: "こ", hint: "こまの「こ」", sound: "こ" },
      { kana: "さ", hint: "さかなの「さ」", sound: "さ" },
      { kana: "し", hint: "しまうまの「し」", sound: "し" },
      { kana: "す", hint: "すいかの「す」", sound: "す" },
      { kana: "せ", hint: "せみの「せ」", sound: "せ" },
      { kana: "そ", hint: "そらの「そ」", sound: "そ" },
      { kana: "た", hint: "たこの「た」", sound: "た" },
      { kana: "ち", hint: "ちょうちょの「ち」", sound: "ち" },
      { kana: "つ", hint: "つみきの「つ」", sound: "つ" },
      { kana: "て", hint: "てぶくろの「て」", sound: "て" },
      { kana: "と", hint: "とけいの「と」", sound: "と" },
      { kana: "な", hint: "なすの「な」", sound: "な" },
      { kana: "に", hint: "にじの「に」", sound: "に" },
      { kana: "ぬ", hint: "ぬいぐるみの「ぬ」", sound: "ぬ" },
      { kana: "ね", hint: "ねこの「ね」", sound: "ね" },
      { kana: "の", hint: "のりものの「の」", sound: "の" },
      { kana: "は", hint: "はなの「は」", sound: "は" },
      { kana: "ひ", hint: "ひこうきの「ひ」", sound: "ひ" },
      { kana: "ふ", hint: "ふねの「ふ」", sound: "ふ" },
      { kana: "へ", hint: "へびの「へ」", sound: "へ" },
      { kana: "ほ", hint: "ほしの「ほ」", sound: "ほ" },
      { kana: "ま", hint: "まめの「ま」", sound: "ま" },
      { kana: "み", hint: "みかんの「み」", sound: "み" },
      { kana: "む", hint: "むしの「む」", sound: "む" },
      { kana: "め", hint: "めがねの「め」", sound: "め" },
      { kana: "も", hint: "ももの「も」", sound: "も" },
      { kana: "や", hint: "やまの「や」", sound: "や" },
      { kana: "ゆ", hint: "ゆきの「ゆ」", sound: "ゆ" },
      { kana: "よ", hint: "よっとの「よ」", sound: "よ" },
      { kana: "ら", hint: "らっぱの「ら」", sound: "ら" },
      { kana: "り", hint: "りんごの「り」", sound: "り" },
      { kana: "る", hint: "るすばんの「る」", sound: "る" },
      { kana: "れ", hint: "れもんの「れ」", sound: "れ" },
      { kana: "ろ", hint: "ろけっとの「ろ」", sound: "ろ" },
      { kana: "わ", hint: "わにの「わ」", sound: "わ" },
      { kana: "を", hint: "えほんをよむの「を」", sound: "を" },
      { kana: "ん", hint: "みかんの「ん」", sound: "ん" }
    ];

    const modeMap = {
      easy: 5,
      normal: 15,
      hard: kanaData.length
    };

    const totalQuestions = 10;
    let currentMode = "easy";
    let activeKanaPool = [];
    let questionIndex = 0;
    let score = 0;
    let currentAnswer = null;
    let locked = false;
    let lastQuestions = [];

    const menuScreen = document.getElementById("menuScreen");
    const gameScreen = document.getElementById("gameScreen");
    const resultScreen = document.getElementById("resultScreen");
    const parentBtn = document.getElementById("parentBtn");
    const parentPanel = document.getElementById("parentPanel");
    const soundToggle = document.getElementById("soundToggle");
    const hintToggle = document.getElementById("hintToggle");
    const autoNextToggle = document.getElementById("autoNextToggle");
    const questionCount = document.getElementById("questionCount");
    const scoreBox = document.getElementById("scoreBox");
    const bestBox = document.getElementById("bestBox");
    const progressBar = document.getElementById("progressBar");
    const targetKana = document.getElementById("targetKana");
    const hintText = document.getElementById("hintText");
    const choices = document.getElementById("choices");
    const message = document.getElementById("message");
    const nextBtn = document.getElementById("nextBtn");
    const backMenuBtn = document.getElementById("backMenuBtn");
    const retryBtn = document.getElementById("retryBtn");
    const homeBtn = document.getElementById("homeBtn");
    const resultFace = document.getElementById("resultFace");
    const resultTitle = document.getElementById("resultTitle");
    const resultScore = document.getElementById("resultScore");
    const resultStars = document.getElementById("resultStars");
    const resultMessage = document.getElementById("resultMessage");

    function showScreen(screenName) {
      menuScreen.classList.remove("active");
      gameScreen.classList.remove("active");
      resultScreen.classList.remove("active");

      if (screenName === "menu") {
        menuScreen.classList.add("active");
      }

      if (screenName === "game") {
        gameScreen.classList.add("active");
      }

      if (screenName === "result") {
        resultScreen.classList.add("active");
      }
    }

    function getBestScore() {
      const key = "hiraganaBusBest_" + currentMode;
      const saved = window.localStorage.getItem(key);
      const value = Number(saved);
      if (Number.isFinite(value)) {
        return value;
      }
      return 0;
    }

    function saveBestScore() {
      const best = getBestScore();
      if (score > best) {
        const key = "hiraganaBusBest_" + currentMode;
        window.localStorage.setItem(key, String(score));
      }
    }

    function shuffleArray(array) {
      const result = array.slice();
      for (let i = result.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = result[i];
        result[i] = result[j];
        result[j] = temp;
      }
      return result;
    }

    function speak(text) {
      if (!soundToggle.checked) {
        return;
      }

      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = 0.82;
      utterance.pitch = 1.1;
      utterance.volume = 1;
      window.speechSynthesis.speak(utterance);
    }

    function makeQuestionPool(mode) {
      const count = modeMap[mode];
      return kanaData.slice(0, count);
    }

    function pickQuestionKana() {
      let candidates = activeKanaPool.slice();

      if (activeKanaPool.length > 3) {
        candidates = candidates.filter(function(item) {
          return !lastQuestions.includes(item.kana);
        });
      }

      if (candidates.length === 0) {
        candidates = activeKanaPool.slice();
      }

      const picked = candidates[Math.floor(Math.random() * candidates.length)];
      lastQuestions.push(picked.kana);

      if (lastQuestions.length > 3) {
        lastQuestions.shift();
      }

      return picked;
    }

    function makeChoices(answerItem) {
      const wrongPool = activeKanaPool.filter(function(item) {
        return item.kana !== answerItem.kana;
      });

      const wrongs = shuffleArray(wrongPool).slice(0, 2);
      return shuffleArray([answerItem].concat(wrongs));
    }

    function updateStatus() {
      questionCount.textContent = String(questionIndex + 1) + " / " + String(totalQuestions);
      scoreBox.textContent = "⭐ " + String(score);
      bestBox.textContent = "🏆 " + String(getBestScore());
      const progressPercent = Math.round((questionIndex / totalQuestions) * 100);
      progressBar.style.width = String(progressPercent) + "%";
    }

    function setMessage(text, type) {
      message.textContent = text;
      message.classList.remove("good-text");
      message.classList.remove("bad-text");

      if (type === "good") {
        message.classList.add("good-text");
      }

      if (type === "bad") {
        message.classList.add("bad-text");
      }
    }

    function renderQuestion() {
      locked = false;
      nextBtn.style.display = "none";
      updateStatus();

      currentAnswer = pickQuestionKana();
      targetKana.textContent = currentAnswer.kana;

      if (hintToggle.checked) {
        hintText.textContent = currentAnswer.hint;
      } else {
        hintText.textContent = "";
      }

      setMessage("おなじ もじは どれかな？", "");
      choices.innerHTML = "";

      const choiceItems = makeChoices(currentAnswer);

      choiceItems.forEach(function(item) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "choice-btn";
        button.textContent = item.kana;
        button.setAttribute("aria-label", item.kana);
        button.addEventListener("click", function() {
          checkAnswer(item.kana, button);
        });
        choices.appendChild(button);
      });

      speak(currentAnswer.sound);
    }

    function checkAnswer(kana, button) {
      if (locked) {
        return;
      }

      if (kana === currentAnswer.kana) {
        locked = true;
        score += 1;
        button.classList.add("good");
        setMessage("せいかい！バスを たすけたよ！", "good");
        speak("せいかい。すごいね。");

        Array.from(choices.children).forEach(function(child) {
          child.disabled = true;
          if (child.textContent === currentAnswer.kana) {
            child.classList.add("good");
          }
        });

        updateStatus();

        if (autoNextToggle.checked) {
          window.setTimeout(function() {
            goNext();
          }, 900);
        } else {
          nextBtn.style.display = "block";
        }

        return;
      }

      button.classList.add("bad");
      button.disabled = true;
      setMessage("おしい！もういっかい見てみよう", "bad");
      speak("おしい。もういっかい。");
    }

    function goNext() {
      questionIndex += 1;

      if (questionIndex >= totalQuestions) {
        finishGame();
        return;
      }

      renderQuestion();
    }

    function finishGame() {
      progressBar.style.width = "100%";
      saveBestScore();
      resultScore.textContent = String(totalQuestions) + "もん中 " + String(score) + "もん せいかい";

      if (score === totalQuestions) {
        resultFace.textContent = "🏆";
        resultTitle.textContent = "ぜんぶ せいかい！";
        resultStars.textContent = "⭐⭐⭐⭐⭐";
        resultMessage.textContent = "バスは ぴかぴか！すごい！";
        speak("ぜんぶせいかい。すごいね。");
      } else if (score >= 7) {
        resultFace.textContent = "🎉";
        resultTitle.textContent = "とても よくできました！";
        resultStars.textContent = "⭐⭐⭐⭐";
        resultMessage.textContent = "たくさんのバスを たすけたよ！";
        speak("とてもよくできました。");
      } else if (score >= 4) {
        resultFace.textContent = "😊";
        resultTitle.textContent = "がんばったね！";
        resultStars.textContent = "⭐⭐⭐";
        resultMessage.textContent = "もういっかいで もっとできるよ！";
        speak("がんばったね。");
      } else {
        resultFace.textContent = "🚌";
        resultTitle.textContent = "れんしゅう できたね！";
        resultStars.textContent = "⭐⭐";
        resultMessage.textContent = "ゆっくりで だいじょうぶ！";
        speak("れんしゅうできたね。");
      }

      showScreen("result");
    }

    function startGame(mode) {
      currentMode = mode;
      activeKanaPool = makeQuestionPool(mode);
      questionIndex = 0;
      score = 0;
      currentAnswer = null;
      locked = false;
      lastQuestions = [];
      showScreen("game");
      renderQuestion();
    }

    parentBtn.addEventListener("click", function() {
      parentPanel.classList.toggle("active");
    });

    Array.from(document.querySelectorAll(".mode-btn")).forEach(function(button) {
      button.addEventListener("click", function() {
        const mode = button.getAttribute("data-mode");
        startGame(mode);
      });
    });

    nextBtn.addEventListener("click", function() {
      goNext();
    });

    backMenuBtn.addEventListener("click", function() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      showScreen("menu");
    });

    retryBtn.addEventListener("click", function() {
      startGame(currentMode);
    });

    homeBtn.addEventListener("click", function() {
      showScreen("menu");
    });

    document.addEventListener("visibilitychange", function() {
      if (document.hidden && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    });
  </script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function() {
        navigator.serviceWorker.register("./sw.js").catch(function() {
          // オフライン対応に失敗しても、ゲーム本体はそのまま動きます。
        });
      });
    }
  </script>
</body>
</html>
